name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Prove clean npm installation
        run: npm run test:npm

  npm-package:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm run test:npm

  public-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Keep internal notes out of the public repository
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore. Move internal notes to the private research repository."
            echo "$tracked"
            exit 1
          fi
