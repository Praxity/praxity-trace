<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic flood model</title></head>
<body>
<main>
<h1>Synthetic flood model</h1>
<p>This teaching model starts with an upstream reading of 16 units. Each 10% of relief opening lowers it by 0.8 units.</p>
<label for="relief">Relief channel opening: <output id="setting" for="relief">0%</output></label>
<input id="relief" type="range" min="0" max="100" step="10" value="0">
<p>Upstream reading: <output id="reading" for="relief">16.0 units</output></p>
</main>
<script>
const relief = document.getElementById('relief');
relief.addEventListener('input', () => {
  document.getElementById('setting').textContent = relief.value + '%';
  document.getElementById('reading').textContent = (16 - Number(relief.value) * 0.08).toFixed(1) + ' units';
});
</script>
</body>
</html>
